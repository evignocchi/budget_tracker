<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Registrati — Budget Tracker</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="auth-page">
  <div class="card auth-card">
    <h1>Crea il tuo account</h1>
    <p class="muted">Inizia a tenere sotto controllo le tue finanze</p>
    <form id="signup-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" />
        <span class="muted">Almeno 8 caratteri</span>
      </div>
      <div class="field">
        <label for="password2">Conferma password</label>
        <input type="password" id="password2" name="password2" required minlength="8" autocomplete="new-password" />
      </div>
      <p class="error-message" id="error"></p>
      <button type="submit" id="submit-btn">Registrati</button>
    </form>
    <p class="muted" style="margin-top:16px;">Hai già un account? <a href="/login.html">Accedi</a></p>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
