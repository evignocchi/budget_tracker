<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Accedi — Budget Tracker</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="auth-page">
  <div class="card auth-card">
    <h1>Bentornato</h1>
    <p class="muted">Accedi al tuo Budget Tracker</p>
    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
      </div>
      <p class="error-message" id="error"></p>
      <button type="submit" id="submit-btn">Accedi</button>
    </form>
    <p class="muted" style="margin-top:16px;">Non hai un account? <a href="/signup.html">Registrati</a></p>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
